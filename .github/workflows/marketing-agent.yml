# Marketing agent (marketing/AGENT.md): every morning new app videos, on
# Tuesdays and Fridays a hero video with Veo; all of it waits for approval in
# the admin console (tab Freigabe). Every paid call is reserved against the
# daily and weekly budget in the backend first.
name: Marketing-Agent

on:
  schedule:
    # 04:07 UTC = 06:07 in summer, 05:07 in winter (Berlin): app videos
    - cron: '7 4 * * *'
    # Tuesday and Friday half an hour later: hero video
    - cron: '37 4 * * 2,5'
  workflow_dispatch:
    inputs:
      mode:
        description: Was soll entstehen?
        type: choice
        options: [app, hero, figuren]
        default: app
      count:
        description: Wie viele App-Videos (1–4)
        default: '2'

permissions:
  contents: read

concurrency:
  group: marketing-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      # ffmpeg for the MP4s, the emoji font for chat bubbles and notifications
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji
      - run: npm ci
        working-directory: marketing
      - name: Agent
        id: agent
        working-directory: marketing
        # Below the job's 60 minutes, so a hanging run fails here and gets reported below
        timeout-minutes: 55
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MARKETING_AGENT_KEY: ${{ secrets.MARKETING_AGENT_KEY }}
          AD_COUNT: ${{ inputs.count || '2' }}
          CHROME: /usr/bin/google-chrome
          MODE: ${{ inputs.mode || (github.event.schedule == '37 4 * * 2,5' && 'hero') || 'app' }}
        run: |
          case "$MODE" in
            hero) node agent/hero.js ;;
            figuren) node agent/references.js ;;
            *) node agent/daily.js ;;
          esac
      # Plan 2.14: a failed run reaches the owners as the alert agent_failed
      # (push and mail): the mode as the step and the link to this run, never
      # the error itself. Same backend as agent/common.js (API_URL, default
      # api.wannayap.app); a failing report only leaves a warning here.
      - name: Fehlschlag melden
        if: failure()
        env:
          MARKETING_AGENT_KEY: ${{ secrets.MARKETING_AGENT_KEY }}
          MODE: ${{ inputs.mode || (github.event.schedule == '37 4 * * 2,5' && 'hero') || 'app' }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          API="${API_URL:-https://api.wannayap.app}"
          if [ "$AGENT_OUTCOME" = "failure" ]; then STEP="$MODE"; else STEP="setup ($MODE)"; fi
          BODY=$(jq -n --arg step "$STEP" --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{failed: true, step: $step, runUrl: $runUrl}')
          curl -fsS -X POST "$API/marketing/notify" \
            -H "Authorization: Bearer $MARKETING_AGENT_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            || echo "::warning::Fehlschlag konnte nicht an das Backend gemeldet werden"
      # The rendered videos and the model's texts, for a look without the console
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-agent
          path: marketing/dist/agent/
          retention-days: 7
          if-no-files-found: ignore
