# Daily marketing agent (marketing/agent/daily.js): new ad videos land in the
# admin console (tab Freigabe) every morning. Setup: marketing/AGENT.md.
name: Marketing-Agent

on:
  schedule:
    # 04:07 UTC = 06:07 in summer, 05:07 in winter (Berlin)
    - cron: '7 4 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: Wie viele Videos (1–4)
        default: '2'

permissions:
  contents: read

concurrency:
  group: marketing-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      # ffmpeg for the MP4s, the emoji font for chat bubbles and notifications
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji
      - run: npm ci
        working-directory: marketing
      - run: node agent/daily.js
        working-directory: marketing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKETING_AGENT_KEY: ${{ secrets.MARKETING_AGENT_KEY }}
          AD_COUNT: ${{ inputs.count || '2' }}
          CHROME: /usr/bin/google-chrome
      # The rendered videos and the model's texts, for a look without the console
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-agent
          path: marketing/dist/agent/
          retention-days: 7
          if-no-files-found: ignore
