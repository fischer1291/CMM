# The one way to TestFlight: GitHub → Actions → iOS-Build → Run workflow.
# EAS builds the production app from main on its Macs, counts the build number
# and uploads it to App Store Connect. The run waits for both and is green only
# when the build really is at Apple; its summary shows the build number and
# links. After a finished build the run tags the commit ios/v<version>-b<build>
# and publishes a GitHub release with this version's CHANGELOG.md section, so
# every Store build is findable by tag (change-failure rate, rollback target).
# One-time setup (already done): docs/RELEASE.md.
name: iOS-Build
run-name: iOS-Build ${{ inputs.submit && 'nach TestFlight' || 'ohne Upload' }}

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Danach zu App Store Connect hochladen (TestFlight)
        type: boolean
        default: true
      was_testen:
        description: Was testen? (steht in der Zusammenfassung des Laufs zum Einfügen in TestFlight, optional)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Build (about 15–25 min on EAS, longer when EAS is busy) plus upload
    timeout-minutes: 120
    outputs:
      version: ${{ steps.result.outputs.version }}
      build: ${{ steps.result.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup vorhanden?
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN fehlt (GitHub → Settings → Secrets and variables → Actions). Siehe docs/RELEASE.md."
            exit 1
          fi
          if [ "$SUBMIT" = "true" ] && ! node -e 'process.exit(/^\d+$/.test(require("./eas.json").submit?.production?.ios?.ascAppId || "") ? 0 : 1)'; then
            echo "::error::In eas.json fehlt submit.production.ios.ascAppId: die Apple-ID der App aus App Store Connect. Siehe docs/RELEASE.md."
            exit 1
          fi
          node scripts/version.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # EAS prints its progress here; the result (JSON) goes outside the checkout, which must stay clean
      # No --what-to-test: EAS passes a tester note to TestFlight on the
      # Enterprise plan only and refuses the whole submission otherwise
      # ("Changelog submission is currently available for Enterprise plan
      # only"). The note goes into this run's summary instead, to paste into
      # App Store Connect → TestFlight → the build → "Was testen?".
      - name: Build und Upload
        env:
          SUBMIT: ${{ inputs.submit }}
          NOTE: ${{ inputs.was_testen }}
        run: |
          args=(--platform ios --profile production --non-interactive --json)
          if [ "$SUBMIT" = "true" ]; then
            args+=(--auto-submit)
          fi
          if [ -n "$NOTE" ]; then
            printf '### Was testen? (in TestFlight einfügen)\n\n%s\n\n' "$NOTE" >> "$GITHUB_STEP_SUMMARY"
          fi
          set +e
          eas build "${args[@]}" > "$RUNNER_TEMP/build.json"
          status=$?
          set -e
          node scripts/ios-build-summary.js "$RUNNER_TEMP/build.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      # Also when only the upload failed: a finished build exists at EAS, can be
      # uploaded by hand later and still gets its tag (empty when none finished)
      - name: Version und Build-Nummer
        id: result
        if: always()
        run: node scripts/ios-build-summary.js "$RUNNER_TEMP/build.json" --outputs >> "$GITHUB_OUTPUT"

  # Only this job may write: the tag and the release (docs/RELEASE.md, "Tags")
  tag:
    needs: build
    if: always() && needs.build.outputs.build != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same Node as the build job; the changelog script needs no npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag ios/v<version>-b<build> und GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          tag="ios/v${VERSION}-b${BUILD}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag gibt es schon"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Wanna yap? $VERSION (Build $BUILD)"
          git push origin "$tag"
          node scripts/changelog-section.js "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --title "Wanna yap? $VERSION (Build $BUILD)" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Tag und Release: $tag" >> "$GITHUB_STEP_SUMMARY"
